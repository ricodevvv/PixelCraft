name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pixelcraft
          POSTGRES_PASSWORD: pixelcraft
          POSTGRES_DB: pixelcraft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pixelcraft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://pixelcraft:pixelcraft@localhost:5432/pixelcraft
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
