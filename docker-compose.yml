services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pixelcraft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pixelcraft}
      POSTGRES_DB: pixelcraft
    volumes:
      - pixelcraft-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelcraft"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://pixelcraft:${POSTGRES_PASSWORD:-pixelcraft}@db:5432/pixelcraft
    ports:
      - "3000:3000"

volumes:
  pixelcraft-db:
